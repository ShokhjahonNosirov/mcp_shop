# Lint and the full test suite on every push and pull request. No Claude API
# calls: the agent and eval tests use a fake client, so this costs nothing.
name: CI

on:
  # Pull requests are checked once; main is checked again after each merge,
  # which is what the README badge shows.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      # Same image and owner settings as the db service in docker-compose.yml.
      # The data is seeded in a step below, once the repository is checked out.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: shop
          POSTGRES_USER: shop_owner
          POSTGRES_PASSWORD: shop_owner_pw
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U shop_owner -d shop"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      # Integration tests connect as the read-only role, like the server.
      SHOP_MCP_TEST_DATABASE_URL: postgresql://mcp_readonly:mcp_readonly_pw@127.0.0.1:55432/shop
      # Fail instead of skipping if the database is missing.
      SHOP_MCP_REQUIRE_TEST_DB: "1"

    steps:
      - uses: actions/checkout@v5

      - name: Seed the database (schema, seed data, read-only role)
        run: sh db/apply-init-scripts.sh
        env:
          PGHOST: 127.0.0.1
          PGPORT: "55432"
          PGPASSWORD: shop_owner_pw
          POSTGRES_USER: shop_owner
          POSTGRES_DB: shop
          MCP_READONLY_PASSWORD: mcp_readonly_pw

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5" # same as the Dockerfile
          enable-cache: true

      - name: Install dependencies
        # --locked fails if uv.lock is out of date with pyproject.toml.
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check --output-format=github .

      - name: Tests
        run: uv run pytest -ra
