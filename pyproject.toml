[project]
name = "shop-mcp"
version = "0.1.0"
description = "Read-only MCP server exposing a demo e-commerce PostgreSQL database to AI agents, plus a Claude agent that uses it"
readme = "README.md"
authors = [
    { name = "Shokhjahon Nosirov", email = "shokhjahonnosirov@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.12.0",
    "mcp>=2,<3",
    "psycopg-pool>=3.2",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6.0.4",
    "sqlglot>=30.25.0",
]

[project.scripts]
shop-mcp = "shop_mcp.server:main"
shop-agent = "shop_agent.cli:main"
shop-evals = "shop_evals.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# One distribution, three packages: the server, the agent that uses it,
# and the evals that measure the agent.
module-name = ["shop_mcp", "shop_agent", "shop_evals"]

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "pytest>=9.1.1",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Database.fetch nests the connection and transaction blocks on purpose: the
# comment between them explains why the transaction always rolls back.
"src/shop_mcp/db.py" = ["SIM117"]
